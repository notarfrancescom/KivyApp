name: Android CI Buildozer Manual (Patch Anti-Libffi)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    # Utilizza Ubuntu 22.04 LTS per maggiore stabilità con i vecchi NDK
    runs-on: ubuntu-22.04 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          # Versione Python compatibile con NDK 21b
          python-version: '3.8' 

      - name: Install Buildozer and Dependencies
        run: |
          pip install buildozer cython 
          sudo apt update
          # Installazione dei tool necessari per la compilazione nativa
          sudo apt install -y build-essential git wget zip unzip zlib1g-dev libtool m4
          
      - name: Buildozer Setup, License, and Patch
        run: |
          # 1. Pulizia Forzata
          rm -rf /home/runner/.buildozer/android
          
          # 2. Setup Buildozer (Scarica NDK, SDK e p4a)
          echo "Avvio setup Buildozer..."
          buildozer android update
          
          # 3. Trova il path dell'SDK Manager
          SDK_TOOLS_BIN=$(find /home/runner/.buildozer/android/platform/android-sdk/ -name 'sdkmanager' -type f -print -quit)
          
          if [ ! -f "$SDK_TOOLS_BIN" ]; then
             echo "ERRORE: sdkmanager non trovato dopo il setup iniziale."
             exit 1
          fi

          # 4. Accetta le Licenze e Installa TUTTI i pacchetti necessari
          echo "Accettazione di tutte le licenze Android e installazione dei pacchetti essenziali..."
          
          # Tentiamo l'accettazione delle licenze di TUTTI i pacchetti principali
          yes | "$SDK_TOOLS_BIN" --licenses

          # Ora installiamo i pacchetti essenziali necessari per la compilazione (API 27 e Build Tools 30.0.3)
          # Questi non dovrebbero più chiedere la licenza dopo il comando precedente
          yes | "$SDK_TOOLS_BIN" "platform-tools" "build-tools;30.0.3" "platforms;android-27"

          # 5. Patch del bug Libffi
          echo "Applicazione della patch per libffi/autoreconf..."
          HACKS_DIR=$(find /home/runner/.buildozer/android/platform -name 'build-hacks' -type d -print -quit)
          
          if [ -d "$HACKS_DIR" ]; then
             sed -i 's|LT_SYS_SYMBOL_USCORE|#LT_SYS_SYMBOL_USCORE|g' "$HACKS_DIR/libffi/acinclude.m4"
             echo "Patch applicata a $HACKS_DIR/libffi/acinclude.m4"
          else
             echo "ATTENZIONE: Directory build-hacks non trovata."
             exit 1
          fi


      - name: Compile APK via Buildozer (Release Finale)
        env:
          # Forziamo NDK 21b e la compilazione su singolo thread per evitare crash
          ANDROIDNDK: 21b 
          P4A_COMPILE_ENDIAN_SINGLE: 1 
        run: |
          # Eseguiamo il build release completo
          yes | buildozer android release
        
      # ----------------------------------------------------------------------
      # --- FIRMA APK (Non modificare se le Secrets sono configurate) ---
      # ----------------------------------------------------------------------
      - name: Decode Keystore
        if: success()
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android.keystore

      - name: Sign APK
        if: success()
        run: |
          APK_PATH=$(find ./bin -name "*-release-unsigned.apk" -print -quit)
          
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
          -keystore android.keystore \
          -storepass ${{ secrets.KEYSTORE_PASS }} \
          $APK_PATH ${{ secrets.KEY_ALIAS }} \
          -keypass ${{ secrets.KEY_PASS }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk-release
          path: ./bin/*.apk
          
