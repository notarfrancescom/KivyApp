name: Android CI Buildozer Manual (Patch Anti-Libffi)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.8' 

      - name: Install Buildozer and Dependencies
        run: |
          pip install buildozer cython 
          sudo apt update
          sudo apt install -y build-essential git wget zip unzip zlib1g-dev libtool m4
          
      - name: Manual Android SDK/NDK Setup (Final Attempt)
        id: android_setup
        run: |
          # 1. Definisci le directory (stesse usate da Buildozer)
          export SDK_DIR=/home/runner/.buildozer/android/platform/android-sdk
          export NDK_DIR=/home/runner/.buildozer/android/platform/android-ndk
          export NDK_VER=21b
          
          mkdir -p "$SDK_DIR"
          mkdir -p "$NDK_DIR"

          # 2. Scarica e Unzip l'SDK Command Line Tools
          echo "Download e installazione manuale dell'SDK Command Line Tools..."
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-6609375_latest.zip -O android-cmdline.zip
          unzip -q android-cmdline.zip -d "$SDK_DIR"
          
          # CORREZIONE: Sposta la cartella estratta 'cmdline-tools' nel formato richiesto
          # Nota: Lo zip estrae una cartella chiamata 'cmdline-tools' che contiene i binari.
          # Lo spostiamo in $SDK_DIR/cmdline-tools/latest/
          mkdir -p "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools"/* "$SDK_DIR/cmdline-tools/latest"
          
          export SDK_TOOLS_BIN="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          
          if [ ! -f "$SDK_TOOLS_BIN" ]; then
             echo "ERRORE: sdkmanager non trovato. Path cercato: $SDK_TOOLS_BIN"
             exit 1
          fi

          # 3. Soluzione DEFINITIVA: Crea manualmente il file di accettazione della licenza.
          echo "Creazione forzata del file di licenza Android per bypassare il blocco I/O..."
          mkdir -p "$SDK_DIR/licenses"
          echo "8483b2796c466310f67491d90184aefd8f081498" > "$SDK_DIR/licenses/android-sdk-license"
          echo "d975f826639434f7480e1c2777176d7fae9a4f4d" > "$SDK_DIR/licenses/android-sdk-preview-license"
          
          # 4. Installazione forzata dei pacchetti stabili necessari
          echo "Installazione forzata di Build Tools 30.0.3, Platform Tools e API 28 stabile..."
          "$SDK_TOOLS_BIN" "platform-tools" "build-tools;30.0.3" "platforms;android-28"

          # 5. Scarica e Unzip l'NDK
          echo "Download e installazione manuale di NDK $NDK_VER..."
          wget -q https://dl.google.com/android/repository/android-ndk-r${NDK_VER}-linux.zip -O android-ndk.zip
          unzip -q android-ndk.zip -d "$NDK_DIR"
          mv "$NDK_DIR/android-ndk-r${NDK_VER}" "$NDK_DIR/$NDK_VER"
          
          # 6. Settaggio delle variabili d'ambiente per il passo successivo
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK=$NDK_DIR/$NDK_VER" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_DIR/$NDK_VER" >> $GITHUB_ENV
          echo "$SDK_DIR/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_API=28" >> $GITHUB_ENV
          
          # 7. Applicazione della patch Libffi/Autoreconf
          echo "Esecuzione rapida di buildozer android update per scaricare i file di p4a..."
          buildozer android update

          echo "Applicazione della patch per libffi/autoreconf..."
          HACKS_DIR=$(find /home/runner/.buildozer/android/platform -name 'build-hacks' -type d -print -quit)
          
          if [ -d "$HACKS_DIR" ]; then
             sed -i 's|LT_SYS_SYMBOL_USCORE|#LT_SYS_SYMBOL_USCORE|g' "$HACKS_DIR/libffi/acinclude.m4"
             echo "Patch applicata a $HACKS_DIR/libffi/acinclude.m4"
          else
             echo "ATTENZIONE: Directory build-hacks non trovata."
             exit 1
          fi

      - name: Compile APK via Buildozer (Release Finale)
        env:
          # Queste env sono impostate dal passo precedente, le manteniamo per chiarezza.
          # Impostiamo Buildozer per usare l'API e NDK che abbiamo installato manualmente.
          ANDROID_API: 28 
          ANDROIDNDK: 21b 
          P4A_COMPILE_ENDIAN_SINGLE: 1 
          # L'ignoranza delle licenze ora è superflua, ma la manteniamo per super-precauzione.
          ANDROID_SDK_IGNORE_LICENSES: 1 
        run: |
          # Non usiamo 'yes |' perché tutti i prerequisiti sono installati.
          buildozer android release
        
      - name: Decode Keystore
        if: success()
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android.keystore

      - name: Sign APK
        if: success()
        run: |
          APK_PATH=$(find ./bin -name "*-release-unsigned.apk" -print -quit)
          
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
          -keystore android.keystore \
          -storepass ${{ secrets.KEYSTORE_PASS }} \
          $APK_PATH ${{ secrets.KEY_ALIAS }} \
          -keypass ${{ secrets.KEY_PASS }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk-release
          path: ./bin/*.apk
