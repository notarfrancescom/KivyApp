name: Android CI Buildozer Docker (Ufficiale)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # Step 1: Crea il Keystore (obbligatorio per la firma)
      - name: Create Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android.keystore

      # Step 2: Utilizza l'azione Kivy/Buildozer più affidabile basata su Docker
      - name: Compile and Deploy (Official Action)
        uses: xndr-ru/buildozer-deploy@v2 # <--- AZIONE ROBUSTA
        with:
          # Comando per il build release
          buildozer_command: 'android release'
          # Parametri necessari per la firma dell'APK
          keystore_path: android.keystore
          key_alias: ${{ secrets.KEY_ALIAS }}
          key_store_password: ${{ secrets.KEYSTORE_PASS }}
          key_password: ${{ secrets.KEY_PASS }}

      # Step 3: Upload dell'Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk-release-signed
          # L'APK firmato è disponibile in questa cartella con questa azione
          path: bin/*.apk
