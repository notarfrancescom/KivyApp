name: Android CI Docker Direct (Fix Finale)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # Step 1: Crea il Keystore
      - name: Create Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android.keystore

      # Step 2: Esegui Buildozer usando l'immagine Docker UFFICIALE
      # Questo usa direttamente 'docker run' senza l'azione build/push che falliva.
      - name: Run Buildozer Command inside Official Container
        # Usiamo l'immagine Buildozer stabile dal container registry di Kivy
        run: |
          docker run \
            --rm \
            -v ${{ github.workspace }}:/home/user/app \
            -w /home/user/app \
            ghcr.io/kivy/buildozer:stable \
            buildozer android release 
            
      # Step 3: Firma l'APK
      - name: Find and Sign APK
        run: |
          # Il buildozer.spec deve usare android.ndk=25b e i requisiti moderni
          
          # L'APK non firmato è ora nella cartella bin
          APK_PATH=$(find ./bin -name "*-release-unsigned.apk" -print -quit)
          
          # Firma l'APK
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
          -keystore android.keystore \
          -storepass ${{ secrets.KEYSTORE_PASS }} \
          $APK_PATH ${{ secrets.KEY_ALIAS }} \
          -keypass ${{ secrets.KEY_PASS }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk-release-signed
          path: bin/*.apk
          
