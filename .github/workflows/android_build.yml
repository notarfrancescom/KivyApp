name: Android CI Buildozer Manual (Patch Anti-Libffi)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Allineato al buildozer.spec

      - name: Install Buildozer and Dependencies
        run: |
          pip install buildozer cython 
          sudo apt update
          # Installazione dei tool necessari per la compilazione native
          sudo apt install -y build-essential git wget zip unzip zlib1g-dev libtool m4
      - name: Buildozer Initial Setup and Libffi Patch
        run: |
          # 1. Pulizia Forzata: Rimuove l'intera cache
          rm -rf /home/runner/.buildozer/android
          
          # 2. Setup Buildozer (forza l'accettazione della licenza)
          yes | buildozer android debug # <--- AGGIUNTO yes |
          
          # 3. PATCH DEL BUG LT_SYS_SYMBOL_USCORE (Il vero Fix)
          # Questa patch commenta la riga problematica nel file di configurazione di libffi.
          echo "Applicazione della patch per libffi/autoreconf..."
          sed -i 's|LT_SYS_SYMBOL_USCORE|#LT_SYS_SYMBOL_USCORE|g' /home/runner/.buildozer/android/platform/build-hacks/libffi/acinclude.m4
          echo "Patch applicata."

      - name: Compile APK via Buildozer (Release Finale)
        run: |
          # Eseguiamo il build release completo, che ora userà i file patchati
          yes | buildozer android release
        
      # --- FIRMA APK ---
      - name: Decode Keystore
        if: success()
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android.keystore

      - name: Sign APK
        if: success()
        run: |
          APK_PATH=$(find ./bin -name "*-release-unsigned.apk" -print -quit)
          
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
          -keystore android.keystore \
          -storepass ${{ secrets.KEYSTORE_PASS }} \
          $APK_PATH ${{ secrets.KEY_ALIAS }} \
          -keypass ${{ secrets.KEY_PASS }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk-release
          path: ./bin/*.apk
          
