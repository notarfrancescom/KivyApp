
name: Android CI Buildozer (Java 17 + SDK Fix)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Install Buildozer, Dependencies, and Java 17
        run: |
          pip install buildozer cython
          sudo apt update
          sudo apt install -y build-essential git wget zip unzip zlib1g-dev libtool m4 openjdk-17-jdk curl autoconf automake
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "JAVA_HOME_17_X64=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Manual Android SDK/NDK Setup
        run: |
          export SDK_DIR=/home/runner/.buildozer/android/platform/android-sdk
          export NDK_DIR=/home/runner/.buildozer/android/platform/android-ndk
          export NDK_VER=25c
          export FINAL_NDK_FOLDER="$NDK_DIR/$NDK_VER"

          mkdir -p "$SDK_DIR" "$NDK_DIR"

          # Download Command Line Tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O android-cmdline.zip
          unzip -q android-cmdline.zip -d "$SDK_DIR"
          rm android-cmdline.zip

          # Fix directory structure for sdkmanager
          if [ -d "$SDK_DIR/cmdline-tools/bin" ]; then
              mkdir -p "$SDK_DIR/cmdline-tools/latest"
              mv "$SDK_DIR/cmdline-tools"/* "$SDK_DIR/cmdline-tools/latest/"
          elif [ -d "$SDK_DIR/cmdline-tools/latest" ]; then
              echo "Struttura già corretta, nessuna modifica necessaria."
          else
              echo "Errore: struttura imprevista dei command line tools."
          fi

          # Symlink per compatibilità Buildozer
          mkdir -p "$SDK_DIR/tools/bin"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"

          SDK_TOOLS_BIN="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          # Accept licenses and install SDK packages
          yes | "$SDK_TOOLS_BIN" --licenses > /dev/null
          "$SDK_TOOLS_BIN" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

          # Download NDK r25c
          curl -L -f -o android-ndk.zip "https://dl.google.com/android/repository/android-ndk-r${NDK_VER}-linux.zip"
          unzip -q android-ndk.zip -d "$NDK_DIR"
          rm android-ndk.zip
          mv "$NDK_DIR/android-ndk-r${NDK_VER}" "$FINAL_NDK_FOLDER"

          # Export environment variables
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$FINAL_NDK_FOLDER" >> $GITHUB_ENV
          echo "ANDROID_NDK=$FINAL_NDK_FOLDER" >> $GITHUB_ENV
          echo "NDK_HOME=$FINAL_NDK_FOLDER" >> $GITHUB_ENV
          echo "$SDK_DIR/platform-tools" >> $GITHUB_PATH
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> $GITHUB_PATH

          # Update buildozer.spec
          sed -i '/^\s*android.api\s*=/d' buildozer.spec
          sed -i '/^\s*android.ndk\s*=/d' buildozer.spec
          sed -i '/^\s*android.ndk_path\s*=/d' buildozer.spec
          sed -i '/^\s*python.version\s*=/d' buildozer.spec
          echo "" >> buildozer.spec
          echo "android.api = 34" >> buildozer.spec
          echo "android.ndk = $NDK_VER" >> buildozer.spec
          echo "android.ndk_path = $FINAL_NDK_FOLDER" >> buildozer.spec
          echo "python.version = 3.10" >> buildozer.spec

      - name: Compile APK via Buildozer
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          buildozer android release

      - name: Decode Keystore
        if: success()
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android.keystore

      - name: Sign APK with apksigner
        if: success()
        run: |
          APK_PATH=$(find ./bin -name "*-release-unsigned.apk" -print -quit)
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign \
            --ks android.keystore \
            --ks-pass pass:${{ secrets.KEYSTORE_PASS }} \
            --key-pass pass:${{ secrets.KEY_PASS }} \
            --key ${{ secrets.KEY_ALIAS }} \
            $APK_PATH

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk-release
          path: ./bin/*.apk
