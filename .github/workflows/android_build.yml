name: Android CI Buildozer Manual (Patch Anti-Libffi)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # CAMBIATO a Ubuntu 22.04 per maggiore stabilità NDK
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer and Dependencies
        run: |
          pip install buildozer cython 
          sudo apt update
          # Installazione dei tool necessari per la compilazione native
          sudo apt install -y build-essential git wget zip unzip zlib1g-dev libtool m4
          
      - name: Buildozer Initial Setup and Libffi Patch
        run: |
          # 1. Pulizia e Setup Iniziale (forza accettazione licenza e download toolchain)
          rm -rf /home/runner/.buildozer/android
          yes | buildozer android update
          
          # 2. PATCH DEL BUG LT_SYS_SYMBOL_USCORE (Il vero Fix)
          echo "Applicazione della patch per libffi/autoreconf..."
          # Usiamo find per trovare la directory 'build-hacks' in modo dinamico per maggiore robustezza
          HACKS_DIR=$(find /home/runner/.buildozer/android/platform -name 'build-hacks' -type d -print -quit)
          
          # Esegui la patch solo se la directory è stata trovata
          if [ -d "$HACKS_DIR" ]; then
             # La patch è stata applicata
             sed -i 's|LT_SYS_SYMBOL_USCORE|#LT_SYS_SYMBOL_USCORE|g' "$HACKS_DIR/libffi/acinclude.m4"
             echo "Patch applicata a $HACKS_DIR/libffi/acinclude.m4"
          else
             echo "ATTENZIONE: Directory build-hacks non trovata. Il build potrebbe fallire."
             exit 1 
          fi


      - name: Compile APK via Buildozer (Release Finale - DEBUG)
        env:
          ANDROIDNDK: 23b 
        run: |
          # Forziamo il log_level a 2 per catturare il crash di compilazione.
          yes | buildozer --log-level 2 android release 

      # --- FIRMA APK ---
      - name: Decode Keystore
        if: success()
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android.keystore

      - name: Sign APK
        if: success()
        run: |
          APK_PATH=$(find ./bin -name "*-release-unsigned.apk" -print -quit)
          
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
          -keystore android.keystore \
          -storepass ${{ secrets.KEYSTORE_PASS }} \
          $APK_PATH ${{ secrets.KEY_ALIAS }} \
          -keypass ${{ secrets.KEY_PASS }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk-release
          path: ./bin/*.apk
          
