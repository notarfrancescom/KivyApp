name: Android CI Buildozer Manual (Patch Anti-Libffi)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    # Utilizza Ubuntu 22.04 LTS per maggiore stabilità con i vecchi NDK
    runs-on: ubuntu-22.04 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          # Versione Python compatibile con NDK 21b e Buildozer stabile
          python-version: '3.8' 

      - name: Install Buildozer and Dependencies
        run: |
          pip install buildozer cython 
          sudo apt update
          # Installazione dei tool necessari per la compilazione native
          sudo apt install -y build-essential git wget zip unzip zlib1g-dev libtool m4
          
      - name: Buildozer Initial Setup (Download Toolchain)
        # Questo passo scarica l'NDK (21b), l'SDK e le ricette senza avviare la compilazione
        run: |
          # 1. Pulizia e Setup Iniziale 
          rm -rf /home/runner/.buildozer/android
          buildozer android update 
          
      - name: Force Accept SDK Licenses
        # Passo cruciale per risolvere l'errore 'Accept? (y/N)' e il timeout.
        run: |
          SDK_TOOLS_BIN=$(find /home/runner/.buildozer/android/platform/android-sdk/ -name 'sdkmanager' -type f -print -quit)
          
          if [ -f "$SDK_TOOLS_BIN" ]; then
             echo "Accettazione forzata delle licenze SDK..."
             # Utilizza sdkmanager direttamente
             yes | "$SDK_TOOLS_BIN" --licenses
             echo "Licenze accettate."
          else
             echo "sdkmanager non trovato, errore nel setup precedente."
             exit 1
          fi

      - name: Apply Libffi Patch
        # Patch per risolvere l'errore 'LT_SYS_SYMBOL_USCORE' / 'Broken pipe'
        run: |
          echo "Applicazione della patch per libffi/autoreconf..."
          HACKS_DIR=$(find /home/runner/.buildozer/android/platform -name 'build-hacks' -type d -print -quit)
          
          if [ -d "$HACKS_DIR" ]; then
             sed -i 's|LT_SYS_SYMBOL_USCORE|#LT_SYS_SYMBOL_USCORE|g' "$HACKS_DIR/libffi/acinclude.m4"
             echo "Patch applicata a $HACKS_DIR/libffi/acinclude.m4"
          else
             echo "ATTENZIONE: Directory build-hacks non trovata."
             exit 1 
          fi


      - name: Compile APK via Buildozer (Release Finale)
        env:
          # Forziamo NDK 21b per massima stabilità
          ANDROIDNDK: 21b 
          # Forziamo la compilazione su singolo thread per evitare crash CI
          P4A_COMPILE_ENDIAN_SINGLE: 1 
        run: |
          # Eseguiamo il build release completo
          yes | buildozer android release
        
      # --- FIRMA APK ---
      - name: Decode Keystore
        if: success()
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android.keystore

      - name: Sign APK
        if: success()
        run: |
          APK_PATH=$(find ./bin -name "*-release-unsigned.apk" -print -quit)
          
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
          -keystore android.keystore \
          -storepass ${{ secrets.KEYSTORE_PASS }} \
          $APK_PATH ${{ secrets.KEY_ALIAS }} \
          -keypass ${{ secrets.KEY_PASS }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk-release
          path: ./bin/*.apk
          
