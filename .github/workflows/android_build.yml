name: Android CI Docker Direct

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # Step 1: Crea il Keystore
      - name: Create Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android.keystore

      # Step 2: Esegui Buildozer usando l'immagine Docker UFFICIALE
      # Questo bypassa il problema "repository not found" e l'errore LT_SYS_SYMBOL_USCORE
      - name: Run Buildozer via Docker Hub Image
        uses: docker/build-push-action@v5 # Usiamo un'azione generica per eseguire l'immagine
        with:
          context: .
          push: false
          tags: buildozer_app:latest
          # Usiamo l'immagine Buildozer ufficiale
          target: buildozer/buildozer:stable
          build-args: |
            NDK_VERSION=25b
            ANDROID_API=33

      - name: Run Buildozer Command inside Container
        # Eseguiamo il comando di Buildozer nel container
        run: |
          # Usiamo il container Buildozer per eseguire il comando di compilazione
          docker run \
            -v ${{ github.workspace }}:/home/user/app \
            -w /home/user/app \
            ghcr.io/kivy/buildozer:stable \
            buildozer android release 

      # Step 3: Firma l'APK
      # Questa parte è ancora necessaria perché il container Docker non firma automaticamente
      - name: Find and Sign APK
        run: |
          APK_PATH=$(find ./bin -name "*-release-unsigned.apk" -print -quit)
          
          # Firma l'APK
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
          -keystore android.keystore \
          -storepass ${{ secrets.KEYSTORE_PASS }} \
          $APK_PATH ${{ secrets.KEY_ALIAS }} \
          -keypass ${{ secrets.KEY_PASS }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk-release-signed
          path: bin/*.apk
          
