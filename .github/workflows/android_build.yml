name: Android CI Buildozer Manual (Patch Anti-Libffi)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    # Utilizza Ubuntu 22.04 LTS per maggiore stabilità
    runs-on: ubuntu-22.04 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.8' 

      - name: Install Buildozer and Dependencies
        run: |
          pip install buildozer cython 
          sudo apt update
          sudo apt install -y build-essential git wget zip unzip zlib1g-dev libtool m4
          
      - name: Manual Android SDK/NDK Setup and License Acceptance
        run: |
          # 1. Pulizia Forzata e Setup Buildozer per scaricare NDK e p4a
          rm -rf /home/runner/.buildozer/android
          echo "Avvio setup Buildozer per scaricare solo NDK/SDK base..."
          buildozer android update

          # 2. Trova il path dell'SDK Manager
          SDK_TOOLS_BIN=$(find /home/runner/.buildozer/android/platform/android-sdk/ -name 'sdkmanager' -type f -print -quit)
          
          if [ ! -f "$SDK_TOOLS_BIN" ]; then
             echo "ERRORE: sdkmanager non trovato dopo il setup iniziale."
             exit 1
          fi

          # 3. Tentativo di accettazione generica delle licenze
          echo "Tentativo di accettazione generica di tutte le licenze Android..."
          yes | "$SDK_TOOLS_BIN" --licenses

          # 4. Installazione forzata dei pacchetti stabili necessari (DOPPIO TENTATIVO)
          # A volte le dipendenze richiedono che il comando venga eseguito più volte.
          echo "Installazione forzata di Build Tools 30.0.3, Platform Tools e API 28 stabile (Tentativo 1)..."
          yes | "$SDK_TOOLS_BIN" "platform-tools" "build-tools;30.0.3" "platforms;android-28"

          echo "Installazione forzata di Build Tools 30.0.3, Platform Tools e API 28 stabile (Tentativo 2)..."
          yes | "$SDK_TOOLS_BIN" "platform-tools" "build-tools;30.0.3" "platforms;android-28"


          # 5. Patch del bug Libffi
          echo "Applicazione della patch per libffi/autoreconf..."
          HACKS_DIR=$(find /home/runner/.buildozer/android/platform -name 'build-hacks' -type d -print -quit)
          
          if [ -d "$HACKS_DIR" ]; then
             sed -i 's|LT_SYS_SYMBOL_USCORE|#LT_SYS_SYMBOL_USCORE|g' "$HACKS_DIR/libffi/acinclude.m4"
             echo "Patch applicata a $HACKS_DIR/libffi/acinclude.m4"
          else
             echo "ATTENZIONE: Directory build-hacks non trovata."
             exit 1
          fi
      
      - name: Compile APK via Buildozer (Release Finale)
        env:
          ANDROIDNDK: 21b 
          P4A_COMPILE_ENDIAN_SINGLE: 1 
        run: |
          yes | buildozer android release
        
      - name: Decode Keystore
        if: success()
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android.keystore

      - name: Sign APK
        if: success()
        run: |
          APK_PATH=$(find ./bin -name "*-release-unsigned.apk" -print -quit)
          
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
          -keystore android.keystore \
          -storepass ${{ secrets.KEYSTORE_PASS }} \
          $APK_PATH ${{ secrets.KEY_ALIAS }} \
          -keypass ${{ secrets.KEY_PASS }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk-release
          path: ./bin/*.apk
