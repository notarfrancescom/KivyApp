name: Android CI Buildozer Manual (Patch Anti-Libffi - Java 8 EXPLICIT)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.8' 

      - name: Install Buildozer, Dependencies, and Java 8
        run: |
          pip install buildozer cython 
          sudo apt update
          # Installazione dei tool necessari per la compilazione nativa E Java 8
          sudo apt install -y build-essential git wget zip unzip zlib1g-dev libtool m4 openjdk-8-jdk
          
          # Aggiungi il path esplicito di Java 8 per l'uso successivo.
          # Questo è il percorso standard in Ubuntu 22.04 per openjdk-8-jdk.
          echo "JAVA8_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> $GITHUB_ENV
          echo "JAVA8_BIN=/usr/lib/jvm/java-8-openjdk-amd64/jre/bin/java" >> $GITHUB_ENV


      - name: Manual Android SDK/NDK Setup (Final Attempt)
        id: android_setup
        env:
          JAVA_HOME: ${{ env.JAVA8_HOME }} # Forza l'ambiente per il passo
        run: |
          # 1. Definisci le directory (stesse usate da Buildozer)
          export SDK_DIR=/home/runner/.buildozer/android/platform/android-sdk
          export NDK_DIR=/home/runner/.buildozer/android/platform/android-ndk
          export NDK_VER=21b
          
          mkdir -p "$SDK_DIR"
          mkdir -p "$NDK_DIR"

          # 2. Scarica e Unzip l'SDK Command Line Tools VECCHIO (versione 4333796)
          echo "Download e installazione manuale dell'SDK Command Line Tools LEGACY..."
          wget -q https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip -O android-cmdline.zip
          
          # Estrai direttamente nella cartella SDK
          unzip -q android-cmdline.zip -d "$SDK_DIR"
          
          # Il tool sdkmanager si trova in $SDK_DIR/tools/bin/sdkmanager
          export SDK_TOOLS_BIN="$SDK_DIR/tools/bin/sdkmanager"
          
          if [ ! -f "$SDK_TOOLS_BIN" ]; then
             echo "ERRORE: sdkmanager non trovato. Path cercato: $SDK_TOOLS_BIN"
             exit 1
          fi

          # 3. SOLUZIONE FINALE: Crea manualmente tutti i file di licenza necessari.
          echo "Creazione forzata di TUTTI i file di licenza per bypassare OGNI prompt..."
          mkdir -p "$SDK_DIR/licenses"
          
          # Hash delle licenze più comuni (SDK, Preview, Google APIs)
          LICENSES_CONTENT="8483b2796c466310f67491d90184aefd8f081498\n" # android-sdk-license
          LICENSES_CONTENT+="d975f826639434f7480e1c2777176d7fae9a4f4d\n" # android-sdk-preview-license
          LICENSES_CONTENT+="24333f8a63b6825ea9c5514f83c2829b004d1fee\n" # android-sdk-license (nuovo)
          
          # Scrivi tutte le licenze nel file principale
          echo -e "$LICENSES_CONTENT" > "$SDK_DIR/licenses/android-sdk-license"
          
          # Aggiungi l'hash di google-gapps (richiesta da Play services e Build-Tools)
          echo "33b6a67a0746816094254b1e9564177d1a932d43" > "$SDK_DIR/licenses/google-gapps-license"
          
          # 4. Installazione forzata dei pacchetti stabili necessari
          echo "Installazione forzata di Build Tools 30.0.3, Platform Tools e API 28 stabile..."
          "$SDK_TOOLS_BIN" "platform-tools" "build-tools;30.0.3" "platforms;android-28"

          # 5. Scarica e Unzip l'NDK
          echo "Download e installazione manuale di NDK $NDK_VER..."
          wget -q https://dl.google.com/android/repository/android-ndk-r${NDK_VER}-linux.zip -O android-ndk.zip
          unzip -q android-ndk.zip -d "$NDK_DIR"
          mv "$NDK_DIR/android-ndk-r${NDK_VER}" "$NDK_DIR/$NDK_VER"
          
          # 6. Settaggio delle variabili d'ambiente per il passo successivo
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK=$NDK_DIR/$NDK_VER" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_DIR/$NDK_VER" >> $GITHUB_ENV
          echo "$SDK_DIR/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_API=28" >> $GITHUB_ENV
          
          # 7. Applicazione della patch Libffi/Autoreconf
          echo "Esecuzione rapida di buildozer android update per scaricare i file di p4a..."
          buildozer android update

          echo "Applicazione della patch per libffi/autoreconf..."
          HACKS_DIR=$(find /home/runner/.buildozer/android/platform -name 'build-hacks' -type d -print -quit)
          
          if [ -d "$HACKS_DIR" ]; then
             sed -i 's|LT_SYS_SYMBOL_USCORE|#LT_SYS_SYMBOL_USCORE|g' "$HACKS_DIR/libffi/acinclude.m4"
             echo "Patch applicata a $HACKS_DIR/libffi/acinclude.m4"
          else
             echo "ATTENZIONE: Directory build-hacks non trovata."
             exit 1
          fi
      
      - name: Compile APK via Buildozer (Release Finale)
        env:
          JAVA_HOME: ${{ env.JAVA8_HOME }} # Assicura che Buildozer usi Java 8
          ANDROID_API: 28 
          ANDROIDNDK: 21b 
          P4A_COMPILE_ENDIAN_SINGLE: 1 
          ANDROID_SDK_IGNORE_LICENSES: 1 
        run: |
          buildozer android release
        
      - name: Decode Keystore
        if: success()
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android.keystore

      - name: Sign APK
        if: success()
        env:
          JAVA_HOME: ${{ env.JAVA8_HOME }} # Assicura che jarsigner usi Java 8
        run: |
          APK_PATH=$(find ./bin -name "*-release-unsigned.apk" -print -quit)
          
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
          -keystore android.keystore \
          -storepass ${{ secrets.KEYSTORE_PASS }} \
          $APK_PATH ${{ secrets.KEY_ALIAS }} \
          -keypass ${{ secrets.KEY_PASS }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk-release
          path: ./bin/*.apk
