name: Android CI Buildozer (Convert AAB to APK)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer, Dependencies, and Java 17
        run: |
          pip install "cython<3.0" buildozer
          sudo apt update
          sudo apt install -y build-essential git wget zip unzip zlib1g-dev libtool m4 openjdk-17-jdk curl autoconf automake
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH

      - name: Manual Android SDK/NDK Setup
        run: |
          export SDK_DIR=/home/runner/.buildozer/android/platform/android-sdk
          export NDK_DIR=/home/runner/.buildozer/android/platform/android-ndk
          export NDK_VER=25b
          export FINAL_NDK_FOLDER="$NDK_DIR/android-ndk-r$NDK_VER" # NDK path changed to match Buildozer's default structure

          mkdir -p "$SDK_DIR" "$NDK_DIR"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O android-cmdline.zip
          mkdir -p "$SDK_DIR/cmdline-tools"
          unzip -q android-cmdline.zip -d "$SDK_DIR/cmdline-tools"
          rm android-cmdline.zip
          if [ -d "$SDK_DIR/cmdline-tools/cmdline-tools" ]; then
              mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          fi
          SDK_TOOLS_BIN="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_TOOLS_BIN" --licenses > /dev/null
          "$SDK_TOOLS_BIN" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

          curl -L -f -o android-ndk.zip "https://dl.google.com/android/repository/android-ndk-r${NDK_VER}-linux.zip"
          unzip -q android-ndk.zip -d "$NDK_DIR"
          rm android-ndk.zip
          # Nota: l'NDK viene scompattato direttamente in $NDK_DIR/android-ndk-r25b, Buildozer lo cerca qui
          
          # Fix sdkmanager path for Buildozer
          mkdir -p "$SDK_DIR/tools/bin"
          ln -s "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"

          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$FINAL_NDK_FOLDER" >> $GITHUB_ENV
          echo "PATH=$PATH:$SDK_DIR/platform-tools:$SDK_DIR/cmdline-tools/latest/bin" >> $GITHUB_ENV
          
      - name: Compile DEBUG APK via Buildozer (Clean & Build) 
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set -e
          echo ">>> Eseguo la pulizia completa della build precedente"
          # 1. Pulizia completa per garantire una build fresca
          buildozer android clean
          
          echo ">>> Avvio ricompilazione con Buildozer (Debug APK)"
          # 2. Ricompilazione (creerà nuovamente tutti i file di build, inclusi gli SDK/NDK se la cache non è usata)
          buildozer -v android debug 
          
          echo ">>> Ricerca APK generato"
          APK_PATH=$(find bin -name "*-debug.apk" -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "Errore: APK di debug non trovato!"
            exit 1
          fi
          echo "APK trovato: $APK_PATH"
          
          # Rinomina l'APK per l'upload
          cp "$APK_PATH" myapp-debug.apk
          echo "APK rinominato in myapp-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk-debug
          path: myapp-debug.apk
