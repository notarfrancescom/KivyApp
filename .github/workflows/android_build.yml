name: Android CI Docker Direct (Fix Finale)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # Step 1: Crea il Keystore
      - name: Create Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android.keystore

      # Step 2: Buildozer Unificato (Nuova Immagine Docker)
      - name: Run Buildozer Command inside Robust Container
        run: |
          # Questa immagine (brianhouston) è nota per avere un Entrypoint compatibile con /bin/bash -c.
          # Questo risolve l'errore di licenza (accettato da Buildozer) e l'errore di Entrypoint.
          docker run --rm \
            -v ${{ github.workspace }}:/home/user/app \
            -w /home/user/app \
            brianhouston/buildozer-android:latest \
            /bin/bash -c "yes | buildozer android release"
            
      # Step 3: Firma l'APK
      - name: Find and Sign APK
        run: |
          APK_PATH=$(find ./bin -name "*-release-unsigned.apk" -print -quit)
          
          # Firma l'APK
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
          -keystore android.keystore \
          -storepass ${{ secrets.KEYSTORE_PASS }} \
          $APK_PATH ${{ secrets.KEY_ALIAS }} \
          -keypass ${{ secrets.KEY_PASS }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk-release-signed
          path: bin/*.apk
          
