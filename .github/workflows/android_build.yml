name: Android CI Buildozer Manual (FINAL FIX)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.8' 

      - name: Install Buildozer, Dependencies, and Java 8
        run: |
          pip install buildozer cython 
          sudo apt update
          # Installazione dei tool necessari per la compilazione nativa E Java 8
          sudo apt install -y build-essential git wget zip unzip zlib1g-dev libtool m4 openjdk-8-jdk curl
          
          # Aggiungi il path esplicito di Java 8 per l'uso successivo.
          echo "JAVA8_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> $GITHUB_ENV
          echo "JAVA8_BIN=/usr/lib/jvm/java-8-openjdk-amd64/jre/bin/java" >> $GITHUB_ENV


      - name: Manual Android SDK/NDK Setup (FINAL FIX)
        id: android_setup
        env:
          JAVA_HOME: ${{ env.JAVA8_HOME }} # Forza l'ambiente per sdkmanager
        run: |
          # 1. Definisci le directory (stesse usate da Buildozer)
          export SDK_DIR=/home/runner/.buildozer/android/platform/android-sdk
          export NDK_DIR=/home/runner/.buildozer/android/platform/android-ndk
          export NDK_VER=25c # Versione NDK stabile e disponibile
          
          mkdir -p "$SDK_DIR"
          mkdir -p "$NDK_DIR"

          # 2. Scarica e Unzip l'SDK Command Line Tools VECCHIO (versione 4333796)
          echo "Download e installazione manuale dell'SDK Command Line Tools LEGACY..."
          wget -q https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip -O android-cmdline.zip
          unzip -q android-cmdline.zip -d "$SDK_DIR"
          rm android-cmdline.zip
          
          export SDK_TOOLS_BIN="$SDK_DIR/tools/bin/sdkmanager"
          
          if [ ! -f "$SDK_TOOLS_BIN" ]; then
             echo "ERRORE: sdkmanager non trovato. Path cercato: $SDK_TOOLS_BIN"
             exit 1
          fi

          # 3. BYPASS LICENZA: Crea manualmente tutti i file di licenza necessari.
          echo "Creazione forzata di TUTTI i file di licenza per bypassare OGNI prompt..."
          mkdir -p "$SDK_DIR/licenses"
          LICENSES_CONTENT="8483b2796c466310f67491d90184aefd8f081498\n" 
          LICENSES_CONTENT+="d975f826639434f7480e1c2777176d7fae9a4f4d\n" 
          LICENSES_CONTENT+="24333f8a63b6825ea9c5514f83c2829b004d1fee\n" 
          echo -e "$LICENSES_CONTENT" > "$SDK_DIR/licenses/android-sdk-license"
          echo "33b6a67a0746816094254b1e9564177d1a932d43" > "$SDK_DIR/licenses/google-gapps-license"
          
          # 4. Installazione forzata dei pacchetti SDK
          echo "Installazione forzata di Build Tools 30.0.3, Platform Tools e API 28 stabile..."
          "$SDK_TOOLS_BIN" "platform-tools" "build-tools;30.0.3" "platforms;android-28"

          # 5. Scarica e Unzip l'NDK (USO DI CURL E R25C)
          echo "Download e installazione manuale di NDK $NDK_VER (usando curl)..."
          NDK_ZIP_NAME="android-ndk-r${NDK_VER}-linux.zip"
          NDK_URL="https://dl.google.com/android/repository/$NDK_ZIP_NAME"
          
          # Uso di curl per maggiore robustezza nel download
          curl -L -f -o android-ndk.zip "$NDK_URL"
          
          # Verifica e estrazione
          if [ ! -s "android-ndk.zip" ]; then
             echo "ERRORE FATALE: Download NDK fallito o file ZIP vuoto."
             exit 1
          fi

          unzip -q android-ndk.zip -d "$NDK_DIR"
          rm android-ndk.zip

          # Sposta la cartella estratta nella posizione corretta
          EXTRACTED_NDK_FOLDER="$NDK_DIR/android-ndk-r${NDK_VER}"
          FINAL_NDK_FOLDER="$NDK_DIR/$NDK_VER"
          
          if [ -d "$EXTRACTED_NDK_FOLDER" ]; then
             mv "$EXTRACTED_NDK_FOLDER" "$FINAL_NDK_FOLDER"
             echo "NDK installato con successo in $FINAL_NDK_FOLDER"
          else
             echo "ERRORE CRITICO: La cartella NDK non è stata estratta. Verificare l'URL."
             exit 1
          fi
          
          # 6. Settaggio delle variabili d'ambiente
          echo "Settaggio Variabili d'Ambiente NDK/SDK..."
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK=$FINAL_NDK_FOLDER" >> $GITHUB_ENV # <--- Path NDK r25c
          echo "NDK_HOME=$FINAL_NDK_FOLDER" >> $GITHUB_ENV # <--- Path NDK r25c
          echo "$SDK_DIR/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_API=28" >> $GITHUB_ENV
          
          # 7. Applicazione della patch Libffi/Autoreconf
          echo "Esecuzione rapida di buildozer android update per scaricare i file di p4a..."
          # L'update è necessario per creare la cartella 'build-hacks'
          buildozer android update

          echo "Applicazione della patch per libffi/autoreconf..."
          HACKS_DIR=$(find /home/runner/.buildozer/android/platform -name 'build-hacks' -type d -print -quit)
          
          if [ -d "$HACKS_DIR" ]; then
             sed -i 's|LT_SYS_SYMBOL_USCORE|#LT_SYS_SYMBOL_USCORE|g' "$HACKS_DIR/libffi/acinclude.m4"
             echo "Patch applicata a $HACKS_DIR/libffi/acinclude.m4"
          else
             echo "ATTENZIONE: Directory build-hacks non trovata."
             exit 1
          fi
      
      - name: Compile APK via Buildozer (Release Finale)
        env:
          JAVA_HOME: ${{ env.JAVA8_HOME }} # Forza Java 8 per la compilazione
          ANDROID_API: 28 
          # FORZATURA MANUALE DEL PATH NDK PER SOVRASCRIVERE OGNI VARIABILE AMBIENTALE VECCHIA
          ANDROID_NDK: /home/runner/.build
