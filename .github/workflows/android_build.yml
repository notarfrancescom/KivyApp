name: Android CI Buildozer Automatic

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          # Installiamo le dipendenze essenziali per Kivy e Buildozer
          sudo apt install -y build-essential git zip unzip libtool m4 \
                              openjdk-17-jdk curl autoconf automake \
                              zlib1g-dev libjpeg-dev libpng-dev \
                              libfreetype6-dev libsdl2-dev libsdl2-image-dev \
                              libsdl2-mixer-dev libsdl2-ttf-dev \
                              libportmidi-dev libswscale-dev libavformat-dev \
                              libavcodec-dev
          
          # Aggiorniamo pip e installiamo buildozer e cython
          pip install --upgrade pip
          pip install buildozer cython

      - name: Setup Java Home
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Build with Buildozer
        env:
          # Questa variabile dice a Buildozer di accettare automaticamente le licenze SDK
          # È la chiave magica che sostituisce tutto il lavoro manuale che abbiamo fatto.
          PACKAGES_PATH: ${{ github.workspace }}/.buildozer/android/packages
          ANDROIDSDK: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
          ANDROIDNDK: ${{ github.workspace }}/.buildozer/android/platform/android-ndk-r25b
          # Accettazione automatica licenze (feature di p4a)
          ACCEPT_SDK_LICENSE: "yes" 
          BUILDOZER_ALLOW_ORG_TEST_DOMAIN: 1
          
          python_for_android_dir=$HOME/.buildozer/android/platform/python-for-android


          if [ ! -d "$python_for_android_dir" ]; then


          echo "Cloning python-for-android to $python_for_android_dir"


git clone https://github.com/kivy/python-for-android.git $python_for_android_dir


fi**
        
        run: |
          # Pulizia preventiva
          buildozer android clean

      - name: 💣 Clean Buildozer Cache (Force p4a re-download)
        run: |
          # Rimuovi la cartella locale di buildozer nel progetto
          rm -rf .buildozer
          # Rimuovi la cache globale di buildozer che contiene i download
          rm -rf ~/.buildozer
          
          # Esecuzione del build con yes pipe per sicurezza su prompt imprevisti
          # L'opzione --verbose ci aiuta a vedere cosa succede
          yes | buildozer -v android release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk-release
          path: bin/*.apk
