name: Android CI Docker Direct (Fix Finale)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # Step 1: Crea il Keystore
      - name: Create Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android.keystore

      # Step 2a: Accetta le licenze Android (usando un container generico per la shell)
      - name: Accept Android SDK Licenses
        run: |
          docker run --rm \
            -v /home/runner/.buildozer/android/platform/android-sdk:/opt/android-sdk \
            ubuntu:latest /bin/bash -c "yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses"
            
      # Step 2b: Esegui Buildozer (usando l'immagine Kivy che ora avrà le licenze accettate)
      - name: Run Buildozer Command inside Official Container
        run: |
          # NON USIAMO IL COMANDO BASH E NON ACCETTIAMO LICENZE QUI
          # Usiamo il comando pulito che l'Entrypoint del container si aspetta.
          docker run --rm -v ${{ github.workspace }}:/home/user/app -w /home/user/app kivy/buildozer:latest buildozer android release

     
      # Step 3: Firma l'APK
      - name: Find and Sign APK
        run: |
          # La firma avverrà DOPO che il container ha generato il file -unsigned.apk
          APK_PATH=$(find ./bin -name "*-release-unsigned.apk" -print -quit)
          
          # Firma l'APK
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
          -keystore android.keystore \
          -storepass ${{ secrets.KEYSTORE_PASS }} \
          $APK_PATH ${{ secrets.KEY_ALIAS }} \
          -keypass ${{ secrets.KEY_PASS }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk-release-signed
          path: bin/*.apk
          
